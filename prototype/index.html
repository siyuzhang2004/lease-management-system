<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>租赁财务工作台 · RIGOL</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="calculation.css"></head>
<body>
<header><div class="brand"><b>RIGOL</b><i></i><strong>LMS</strong></div><nav><button data-top="work">☷　工作台</button><button data-top="contract">▤　合同管理</button><button class="active" data-top="finance">▥　财务管理</button><button data-top="report">▧　报表中心</button></nav><div class="user"><span class="demo">合同核算</span><span class="avatar">财</span><span>财务用户<small>财务核算</small></span></div></header>
<aside><div class="aside-title">租赁管理系统 <span>‹</span></div><div class="menu-label">财务管理</div><button data-page="ledger" class="selected"><span>▤</span>租赁余额</button><button data-page="calculation"><span>▦</span>租赁计算表</button><div class="aside-bottom"><span class="online"></span> 本地工作区<small>账套：集团人民币账套</small></div></aside>
<main id="ledgerView"><div class="page-heading"><div><div class="breadcrumb">财务管理 / <span id="crumb">租赁余额</span></div><h1 id="pageTitle">租赁余额</h1><p id="subtitle">按期间查看各项租赁合同的使用权资产与租赁负债余额</p></div><div class="period"><label for="period">余额时点</label><input id="period" type="month" value="2026-10"></div></div>
<section class="metrics" id="metrics"></section>
<section class="content"><div class="tabs"><button class="active" data-scope="all">期间内合同 <em>6</em></button><span id="periodLabel">余额时点：2026年10月 月末</span></div>
<div class="filters"><label class="search">⌕ <input id="search" placeholder="搜索合同编号、名称或出租方"></label><select id="company"><option value="">全部公司</option><option>普源精电</option><option>上海普源</option><option>耐数电子</option></select><select id="type"><option value="">全部资产类别</option><option>房屋及建筑物</option><option>设备</option><option>车辆</option></select><button class="ghost" id="reset">重置</button><div class="spacer"></div><button class="primary" id="primary">＋ 登记合同</button></div>
<div class="section-caption"><span><i></i><b id="tableTitle">租赁合同明细</b><small id="resultCount"></small></span><span class="unit">金额单位：人民币元</span></div>
<div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table><div id="empty" hidden>没有符合条件的记录，请调整筛选条件。</div></div><footer><span id="total"></span><div><span>20 条 / 页</span><button disabled>‹</button><button class="current">1</button><button disabled>›</button></div></footer></section>
<div class="notice"><span>ⓘ</span><div id="noticeText">余额以所选期间月末展示，点击合同可查看月度变化。</div><button id="viewDue" hidden>查看合同 →</button></div><div class="page-foot">RIGOL · 租赁管理系统<span>租赁余额原型 / V0.3</span></div></main>
<div class="overlay" id="overlay" hidden><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><div><small id="drawerKicker">合同财务信息</small><h2 id="drawerTitle"></h2></div><button id="close" aria-label="关闭">×</button></div><div id="drawerBody"></div><div class="drawer-foot"><span>演示操作仅在当前页面生效</span><button class="ghost" id="cancel">关闭</button><button class="primary" id="drawerAction">确认</button></div></section></div><div id="toast" role="status"></div>
<script src="app.js"></script><script src="lease-form.js"></script><script src="calculation-linking.js"></script><script src="calculation.js"></script><script src="contract-advanced.js"></script><script src="rent-phases.js"></script><script src="default-contract.js"></script><script src="contract-workspace.js"></script></body></html>
